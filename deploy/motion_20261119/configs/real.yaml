  spatial_tolerance:
  - 0.025
  - 0.025
  - 0.015
  timing_tolerance: 0.08
stable_policy:
  enabled: true
  asset_dir: ../artifacts/stable_amp
  pd:
    kp_scale: 1.0
    kd_scale: 1.0
