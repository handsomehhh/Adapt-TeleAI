# Dual G1 input: the host normalizes pelvis and estimates the ball once.
# Run this complete strategy inside g1_p1.
# Do not use the legacy mocap bridge: the duel bridge sends estimates.
# mocap_duel maps producer-calibrated pose1 to P1 without flipping.
# The root offset stays identity because the host already applies it.
source:
  ball_topic: /duel/ball_estimate
  ball_type: shared_estimate
  root_topic: /duel/P1/root
  frame: world
  ball_frame: world
  root_frame: world
planner_command_topic: /duel/P1/racket_command
planner_command_schema: g1_1v1_v1
planner_feedback:
  host: 10.203.1.1
  port: 15101
  topic: /duel/P1/planner_state
planner_command_source_frame: world
ball_topic: /duel/ball_estimate
root_topic: /duel/P1/root
world_frame: hope_table
transport: udp
udp:
  host: 10.203.1.2
  port: 15001
source_clock_offset: 0.0
source_max_age: 0.15
transform:
  scale: 1.0
  quaternion_wxyz:
  - 1.0
  - 0.0
  - 0.0
  - 0.0
  translation:
  - 0.0
  - 0.0
  - 0.0
root_marker_to_pelvis:
- 0.0
- 0.0
- 0.0
root_marker_to_pelvis_quaternion_wxyz:
- 1.0
- 0.0
- 0.0
- 0.0
root_stale_timeout: 0.1
root_pose_filter:
  alpha: 0.5
  velocity_alpha: 0.3
  velocity_max_mps: 2.0
  jump_max_m: 0.15
  jump_bypass_seconds: 0.2
  reseed_after: 10
estimator:
  stale_timeout: 0.1
robot_id: P1
ball_source: shared
