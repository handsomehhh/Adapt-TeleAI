# 104-D hitter. Ball/world/feed sections are copied from hope_g1/configs/rally_mujoco_random.yaml.
# hitter.station is the nominal pelvis XY in hope_table; MuJoCo spawns the
# robot at mujoco_to_world_translation[:2], so keep the two equal there.
# feed.plane_x/z_range: the hitter's strike boxes, not hope_g1's.
# feed.y_range: station_y +-0.35 plus FH/BH box Y, about [-1.50, -0.46].
world:
  name: hope_table
  mujoco_to_world_translation: &id001
  - -0.65
  - -0.7625
  - -0.76
physics_profile: mujoco_a3
viewer:
  lookat:
  - 1.2
  - 0.0
  - 0.9
  distance: 5.7
  show_left_ui: false
  show_right_ui: false
  elevation: -20.0
  azimuth: 125.0
feed:
  mode: random_launch
  continuous_on_policy_entry: true
  interval_seconds: 4.0
  world_translation: *id001
  plane_x: -0.22
  y_range:
  - -1.45
  - -0.5
  z_range:
  - -0.1
  - 0.11
  grid:
  - 8
  - 2
  balls_per_cell: 6
  launch:
    x:
    - 1.7
    - 2.5
    y:
    - -1.45
    - -0.075
    z:
    - 0.2
    - 1.4
    vx:
    - -6.0
    - -2.5
    vy:
    - -1.5
    - 1.5
    vz:
    - -2.0
    - 2.0
    batch_size: 4096
    max_batches: 20
    horizon_seconds: 2.0
ball:
  racket_body_name: right_wrist_yaw_link
  racket_offset:
  - 0.215
  - 0.003
  - 0.0
  racket_normal_axis: 1
  racket_radius: 0.075
  ball_radius: 0.02
  racket_restitution: 0.88
  table_restitution: 1.01
  table_tangential_damping: 0.69
  table_near_x: 0.0
  table_far_x: 2.74
  table_width: 1.525
  table_center_y: -0.7625
  table_height: 0.0
  net_height: 0.1525
  net_overhang: 0.15
  gravity: 9.81
  drag: 0.1537
  strike_phase: 0.46
  minimum_intercept_time: 0.35
  arrival_time_jitter: 0.0
  flight_time_range:
  - 0.4
  - 0.5
  incoming_speed_range:
  - 2.0
  - 2.5
  incoming_lateral_speed_range:
  - -0.1
  - 0.1
  incoming_vertical_speed: -2.7
  intercept_jitter:
  - 0.008
  - 0.008
  - 0.004
  target_xy:
  - 2.055
  - -0.7625
  target_jitter:
  - 0.0
  - 0.0
  max_ball_time: 3.0
  target_land_z: 0.0
hitter:
  station:
  - -0.65
  - -0.7625
  planner_config: deploy/hope_g1_hitter/configs/hope_planner.yaml
