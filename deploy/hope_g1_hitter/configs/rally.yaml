# 104-D hitter. Ball/world/feed sections are copied from hope_g1/configs/rally.yaml.
# hitter.station is the nominal pelvis XY in hope_table; MuJoCo spawns the
# robot at mujoco_to_world_translation[:2], so keep the two equal there.
world:
  name: hope_table
  mujoco_to_world_translation:
  - -0.65
  - -0.7625
  - -0.76
physics_profile: real_a3
planner_transport: ros2
ball:
  racket_body_name: right_wrist_yaw_link
  racket_offset:
  - 0.215
  - 0.003
  - 0.0
  racket_normal_axis: 1
  racket_radius: 0.075
  ball_radius: 0.02
  racket_restitution: 0.88
  table_restitution: 1.01
  table_tangential_damping: 0.69
  table_near_x: 0.0
  table_far_x: 2.74
  table_width: 1.525
  table_center_y: -0.7625
  table_height: 0.0
  net_height: 0.1525
  net_overhang: 0.15
  gravity: 9.81
  drag: 0.1537
  strike_phase: 0.46
  minimum_intercept_time: 0.35
  arrival_time_jitter: 0.0
  flight_time_range:
  - 0.4
  - 0.5
  incoming_speed_range:
  - 2.0
  - 2.5
  incoming_lateral_speed_range:
  - -0.1
  - 0.1
  incoming_vertical_speed: -2.7
  intercept_jitter:
  - 0.008
  - 0.008
  - 0.004
  target_xy:
  - 2.055
  - -0.7625
  target_land_z: 0.0
  target_jitter:
  - 0.0
  - 0.0
  max_ball_time: 3.0
hitter:
  side_selection: auto
  # First UP captures the measured base XY; new shots may interrupt the return.
  return_tolerance_m: 0.05
  station:
  - -0.65
  - -0.7625
  # Informational path: start the external ROS planner separately with this file.
  planner_config: deploy/hope_g1_hitter/configs/hope_planner_ros2.yaml
