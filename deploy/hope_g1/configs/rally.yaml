# This task has 22 saved motions (0..21), independent of mjlab's library.
world:
  name: hope_table
  # Only simulated mocap crosses from the MuJoCo floor world.
  mujoco_to_world_translation: [-0.65, -0.7625, -0.76]
physics_profile: real_a3
ready_seconds: 0.0
return_steps: 10
# Complete A3 Stage-2/3 target command; the actor remains the G1 checkpoint.
target_source: hope_planner_optimized_2
# Real deployment consumes commands from the separately launched ROS node.
# MuJoCo rally configs omit this and keep the embedded planner for simulation.
planner_transport: ros2
a3:
  # Matches README-TeleAI's --no-target-clamp --fixed-world-home --no-return-blend.
  target_mode: raw
  reference_mode: a3_live
  # Keep planner interception plane aligned with A30808 config.
  hit_plane_x: 0.0
  flight_seconds: 0.5
  max_command_time_to_strike: 0.5
  command_timeout_seconds: 0.2
  select_settle_ticks: 25
  time_to_strike_invalid_x: 2.5
# TensorBoard at iteration 18000: curriculum_scale=1.0, position half extent=0.25m.
# Play restarts the command curriculum at 0.15; that is not this checkpoint's
# achieved training scale. Set 0.15 explicitly only for a play-start comparison.
target_perturb_scale: 1.0
return_blend_seconds: 0.0
max_intercept_distance: 0.8  # A3 default; this is not a guarantee of G1 reachability.
max_start_frame: 29
selection_hysteresis: 0.05
# Real balls come exclusively from measured mocap; no viewer or simulated feeder.
ball:
  # Shared A3 parameters: .200 hope_planner_optimized/config/hope_planner.yaml.
  racket_body_name: right_wrist_yaw_link
  racket_offset: [0.215, 0.003, 0.0]
  racket_normal_axis: 1
  racket_radius: 0.075
  ball_radius: 0.02
  racket_restitution: 0.88
  table_restitution: 1.01
  table_tangential_damping: 0.69
  table_near_x: 0.0
  table_far_x: 2.74
  table_width: 1.525
  table_center_y: -0.7625
  table_height: 0.0
  net_height: 0.1525
  net_overhang: 0.15
  gravity: 9.81
  drag: 0.1537
  strike_phase: 0.46
  minimum_intercept_time: 0.35
  arrival_time_jitter: 0.0
  flight_time_range: [0.4, 0.5]
  incoming_speed_range: [2.0, 2.5]
  incoming_lateral_speed_range: [-0.1, 0.1]
  incoming_vertical_speed: -2.7
  intercept_jitter: [0.008, 0.008, 0.004]
  target_xy: [2.055, -0.7625]
  target_land_z: 0.0  # A3 planner's table-surface landing target.
  target_jitter: [0.0, 0.0]
  max_ball_time: 3.0

# Parameters follow the shared A3 configuration, matching rally_mujoco_random.yaml.
# REAL_PHYSICS_CALIBRATION.json is historical evidence, not this profile's source.
